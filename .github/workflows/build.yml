name: build

on:
  push:
    # 之前只监听 common 分支，push 到主分支不会跑
    branches: [ main, master, common ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      # :build 会带上 check，从而执行 checkImportBoundary 与 :api:test
      - name: 双端构建与测试
        run: |
          chmod +x gradlew
          ./gradlew :api:build :common:build :fabric:build :forge:build --no-daemon

      - name: 上传产物（只留可直接分发的 jar）
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
            !**/*-dev-shadow.jar
            !**/*-sources.jar
          if-no-files-found: error
          retention-days: 14
