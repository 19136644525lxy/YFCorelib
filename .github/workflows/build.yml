name: build

on:
  push:
    branches: [ common ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: 执行双端构建与测试
        run: |
          chmod +x gradlew
          ./gradlew :api:build :common:build :fabric:build :forge:build --no-daemon
