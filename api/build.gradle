// 纯 Java 模块：不应用 Loom，不依赖 MC 或加载器

base {
	archivesName = "${rootProject.archives_base_name}-api"
}

dependencies {
	// MC 1.20.1 运行时自带 Gson 与 slf4j，api 只需编译期依赖
	compileOnly "com.google.code.gson:gson:2.10.1"
	compileOnly "org.slf4j:slf4j-api:2.0.9"
	testImplementation "com.google.code.gson:gson:2.10.1"
	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testRuntimeOnly "org.slf4j:slf4j-simple:2.0.9"
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}

publishing {
	publications {
		maven(MavenPublication) {
			artifactId = "${rootProject.archives_base_name}-api"
			from components.java
			pom {
				name = artifactId
				description = "YFCoreLib 纯 Java 契约层"
				url = "https://github.com/19136644525lxy/YFCorelib"
				licenses {
					license {
						name = "Apache License 2.0"
						url = "https://www.apache.org/licenses/LICENSE-2.0"
					}
				}
			}
		}
	}
}
