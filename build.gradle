plugins {
	id "architectury-plugin" version "3.4.164"
	id "dev.architectury.loom" version "1.7.435" apply false
}

architectury {
	minecraft = rootProject.minecraft_version
}

allprojects {
	apply plugin: "java-library"
	apply plugin: "maven-publish"

	group = rootProject.maven_group
	version = rootProject.mod_version

	repositories {
		maven { url = uri("https://maven.architectury.dev/") }
		maven { url = uri("https://maven.fabricmc.net/") }
		maven { url = uri("https://maven.minecraftforge.net/") }
		mavenCentral()
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = "UTF-8"
		options.release.set(17)
	}

	// 发布目标：GitHub Packages；凭据读 gradle.properties 的 gpr.user/gpr.key，或环境变量
	publishing {
		repositories {
			maven {
				name = "github"
				url = uri("https://maven.pkg.github.com/19136644525lxy/YFCorelib")
				credentials {
					username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
					password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
				}
			}
		}
	}
}

subprojects {
	if (name != "api") {
		apply plugin: "architectury-plugin"
		apply plugin: "dev.architectury.loom"

		loom {
			silentMojangMappingsLicense()
		}

		dependencies {
			minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
			mappings loom.officialMojangMappings()
		}
	}
}

// 导入边界：api 零 MC/加载器依赖，common 零加载器依赖（编译通过不代表边界正确，故用源码扫描）
def importBoundaries = [
		api   : ~/(?m)^\s*import\s+net\.(minecraft|fabricmc|minecraftforge)\./,
		common: ~/(?m)^\s*import\s+net\.(fabricmc|minecraftforge)\./
]

subprojects {
	def banned = importBoundaries[name]
	if (banned == null) {
		return
	}
	tasks.register("checkImportBoundary") {
		group = "verification"
		description = "校验 ${name} 模块的 import 边界"
		doLast {
			def illegal = fileTree("src/main/java") {
				include "**/*.java"
			}.files.findAll { file -> banned.matcher(file.getText("UTF-8")).find() }
			if (!illegal.isEmpty()) {
				throw new GradleException("${name} 模块存在越界导入:\n" + illegal.collect { it.path }.join("\n"))
			}
		}
	}
	tasks.named("check").configure {
		dependsOn "checkImportBoundary"
	}
}
